services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ktb
      POSTGRES_PASSWORD: ktb
      POSTGRES_DB: ktb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # Uncomment when the workflow engine lands (phase 3).
  # temporal:
  #   image: temporalio/auto-setup:1.25
